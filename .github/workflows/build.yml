name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      publish:
        description: 'Create a GitHub Release after all SDK builds pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Run tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # OpenWrt targets. Add or remove entries as needed.
        include:
          - target: mediatek/filogic
            sdk_arch: aarch64_cortex-a53
            sdk_ver: '24.10.3'
            os: OpenWrt
          - target: x86/64
            sdk_arch: x86_64
            sdk_ver: '24.10.3'
            os: OpenWrt
          - target: ramips/mt7621
            sdk_arch: mipsel_24kc
            sdk_ver: '24.10.3'
            os: OpenWrt

    name: ${{ matrix.sdk_arch }} (${{ matrix.sdk_ver }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev

      - name: Download OpenWrt SDK (${{ matrix.sdk_arch }})
        run: |
          set -euo pipefail
          BASE="https://downloads.openwrt.org/releases/${{ matrix.sdk_ver }}/targets/${{ matrix.target }}"
          FILE=$(wget -qO- "$BASE/" | grep -oE "openwrt-sdk-[^\"']*Linux-x86_64[^\"']*\.tar\.zst" | head -n1)
          echo "SDK file: $FILE"
          wget "$BASE/$FILE"
          tar --zstd -xf "$FILE"
          mkdir -p sdk
          SDK_ROOT=$(find . -maxdepth 1 -type d -name 'openwrt-sdk-*' -print -quit)
          test -n "$SDK_ROOT"
          mv "$SDK_ROOT"/* sdk/
          rmdir "$SDK_ROOT"
          echo "SDK_DIR=$PWD/sdk" >> "$GITHUB_ENV"

      - name: Prepare feed
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p package/arkbridge package/luci-app-arkbridge package/arkbridge-usb
          cp -r "$GITHUB_WORKSPACE/package/arkbridge/." package/arkbridge/
          cp -r "$GITHUB_WORKSPACE/package/luci-app-arkbridge/." package/luci-app-arkbridge/
          cp -r "$GITHUB_WORKSPACE/package/arkbridge-usb/." package/arkbridge-usb/
          ./scripts/feeds update -i || true

      - name: Configure
        run: |
          cd "$SDK_DIR"
          echo "CONFIG_TARGET_$(echo ${{ matrix.target }} | tr '/' '_')=y" >> .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_arkbridge=m
          CONFIG_PACKAGE_luci-app-arkbridge=m
          CONFIG_PACKAGE_usb-uplink=m
          EOF
          make defconfig

      - name: Build
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          make -j"$(nproc)" V=s \
            package/arkbridge/compile \
            package/luci-app-arkbridge/compile \
            package/arkbridge-usb/compile 2>&1 | tee build.log | tail -n 400

      - name: Collect ipk
        run: |
          set -euo pipefail
          mkdir -p out
          # Namespace every ipk by architecture so that arch=all packages
          # (luci-app-arkbridge) from different SDK builds never collide.
          find "$SDK_DIR/bin" \( -name 'arkbridge*.ipk' -o -name 'luci-app-arkbridge*.ipk' \
            -o -name 'usb-uplink*.ipk' \) -print | while read -r f; do
            cp "$f" "out/${{ matrix.sdk_arch }}_$(basename "$f")"
          done
          ls -la out
          for package in arkbridge luci-app-arkbridge usb-uplink; do
            test -n "$(find out -name "*_${package}_*.ipk" -print -quit)" || {
              echo "Missing package artifact: $package" >&2
              exit 1
            }
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ipk-${{ matrix.sdk_arch }}
          path: out/*.ipk
          if-no-files-found: error

  artifacts:
    needs: [build, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          # Plain copy preserves the arch-prefixed names; no flattening overwrite.
          find artifacts -name '*.ipk' -exec cp {} release/ \;
          ls -la release
          for package in arkbridge luci-app-arkbridge usb-uplink; do
            test -n "$(find release -name "*_${package}_*.ipk" -print -quit)" || {
              echo "Missing release artifact: $package" >&2
              exit 1
            }
          done

  publish:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Validate release tag
        id: validate
        env:
          RAW_TAG: ${{ github.event.inputs.version || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Only v<major>.<minor>.<patch> is accepted.
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release tag: $RAW_TAG" >&2
            exit 1
          fi
          # A manual publish may only run from the protected default branch, so
          # the built-and-tested SHA cannot be an arbitrary unreviewed branch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
              [ "$REF" != "refs/heads/arkbridge-main" ]; then
            echo "Refusing to publish from $REF (only refs/heads/arkbridge-main)" >&2
            exit 1
          fi
          # On a tag push the tag necessarily already exists (it is the trigger),
          # so the exists-guard only applies to manual dispatch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && \
              git ls-remote --exit-code --tags \
              "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$RAW_TAG" >/dev/null 2>&1; then
            echo "Refusing to move existing tag: $RAW_TAG" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -name '*.ipk' -exec cp {} release/ \;
          ls -la release
          for package in arkbridge luci-app-arkbridge usb-uplink; do
            test -n "$(find release -name "*_${package}_*.ipk" -print -quit)" || {
              echo "Missing release artifact: $package" >&2
              exit 1
            }
          done
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.validate.outputs.tag }}
          name: ${{ steps.validate.outputs.tag }}
          # Bind the tag/release to the exact commit that produced the ipk.
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
          files: release/*.ipk
