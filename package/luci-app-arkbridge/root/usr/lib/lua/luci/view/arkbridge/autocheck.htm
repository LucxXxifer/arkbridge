<button type="button" class="cbi-button cbi-button-action" onclick="srfAutocheck();return false;"><%:Auto-check%></button>
<div id="srf-autocheck-result" style="margin-top:6px;color:#666;"></div>
<script type="text/javascript">//<![CDATA[
function srfEsc(s){
	return String(s == null ? '' : s)
		.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function srfField(name){
	var n = document.querySelectorAll('input,select,textarea');
	for (var i = 0; i < n.length; i++){
		if ((n[i].name && new RegExp('[.]' + name + '$').test(n[i].name)) || n[i].id === name)
			return n[i];
	}
	return null;
}
function srfFire(el){
	try { el.dispatchEvent(new Event('change', { bubbles: true })); return; } catch (e) {}
	try { var ev = document.createEvent('HTMLEvents'); ev.initEvent('change', true, false); el.dispatchEvent(ev); } catch (e) {}
}
function srfSet(name, value, mark){
	if (value === undefined || value === null)
		return false;
	var el = srfField(name);
	if (!el)
		return false;
	el.value = value;
	srfFire(el);
	if (mark){ el.style.borderColor = '#c00'; el.style.borderStyle = 'solid'; el.title = 'Guessed value - verify before saving'; }
	return true;
}
function srfAutocheck(){
	var out = document.getElementById('srf-autocheck-result');
	out.style.color = '#666';
	out.textContent = 'Checking ...';
	var x = new XMLHttpRequest();
	x.open('GET', window.location.pathname + '/detect', true);
	x.onreadystatechange = function(){
		if (x.readyState !== 4)
			return;
		if (x.status !== 200){ out.style.color = '#c00'; out.textContent = 'Auto-check failed: HTTP ' + x.status; return; }
		var d = {};
		try { d = JSON.parse(x.responseText); } catch (e){ out.style.color = '#c00'; out.textContent = 'Auto-check failed: bad response.'; return; }
		var pr = d.primary || {};
		var cands = [];
		if (Object.prototype.toString.call(d.candidates) === '[object Array]')
			cands = d.candidates;
		var filled = [];
		if (pr.device && pr.gateway && !pr.guessed) {
			if (srfSet('primary_gateway', pr.gateway, false)) filled.push('preferred gateway');
			if (srfSet('primary_device', pr.device, false)) filled.push('preferred device');
		}
		var usable = cands.filter(function (k){ return k.device && k.gateway && !k.guessed; });
		if (usable.length === 1) {
			var c = usable[0];
			if (srfSet('backup_device', c.device, false)) filled.push('backup device');
			if (srfSet('backup_gateway', c.gateway, false)) filled.push('backup gateway');
			if (c.cidr && srfSet('backup_src_prefix', c.cidr, false)) filled.push('backup src CIDR');
		}
		// IPv6 fields are filled into their own fields (never merged with IPv4).
		if (pr.device6 && pr.gateway6 && !pr.guessed6) {
			if (srfSet('primary_gateway6', pr.gateway6, false)) filled.push('preferred IPv6 gateway');
			if (srfSet('primary_device6', pr.device6, false)) filled.push('preferred IPv6 device');
		}
		var usable6 = cands.filter(function (k){ return k.device && k.gateway6 && !k.guessed6; });
		if (usable6.length === 1) {
			if (srfSet('backup_device6', usable6[0].device, false)) filled.push('backup IPv6 device');
			if (srfSet('backup_gateway6', usable6[0].gateway6, false)) filled.push('backup IPv6 gateway');
		}
		var lines = cands.map(function (k){
			return srfEsc(k.device) + ' (IPv4: ' + srfEsc(k.gateway || '-') + (k.guessed ? ' *' : '')
				+ ', IPv6: ' + srfEsc(k.gateway6 || '-') + (k.guessed6 ? ' *' : '') + ')';
		}).join(', ');
		var warn = (pr.guessed || pr.guessed6 || cands.some(function (k){ return k.guessed || k.guessed6; }))
			? '<br><b style="color:#c00;">Note: a gateway marked * is guessed and is not auto-filled. Verify it before entering it manually. Multiple confirmed candidates are not auto-selected.</b>'
			: '';
		out.style.color = '#666';
		out.innerHTML = 'Filled: ' + srfEsc(filled.length ? filled.join(', ') : 'nothing')
			+ '<br>Preferred: ' + srfEsc(pr.gateway || '-') + (pr.guessed ? ' *' : '') + ' (' + srfEsc(pr.device || '-') + ')'
			+ '<br>Candidates: ' + (lines || 'none') + warn;
	};
	x.send();
	return false;
}
//]]></script>
